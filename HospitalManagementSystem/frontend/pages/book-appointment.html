<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment - Hospital Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="../index.html">Hospital Management</a>
        </div>
    </nav>

    <div class="container py-4">
        <h2 class="mb-4">Book Appointment</h2>
        
        <form id="appointmentForm">
            <div class="mb-3">
                <label class="form-label">Select Doctor</label>
                <select class="form-select" id="doctor_id" required>
                    <option value="">Loading doctors...</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Appointment Date</label>
                <input type="date" class="form-control" id="appointment_date" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Appointment Time</label>
                <input type="text" class="form-control" id="appointment_time" placeholder="e.g., 10:00 AM" required>
            </div>
            <button type="submit" class="btn btn-primary">Book Appointment</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/appointments.js"></script>
</body>
</html>
