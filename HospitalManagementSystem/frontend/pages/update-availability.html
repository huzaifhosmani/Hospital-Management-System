<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Availability - Hospital Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="../index.html">Hospital Management</a>
        </div>
    </nav>

    <div class="container py-4">
        <h2 class="mb-4">Update Availability</h2>
        
        <form id="availabilityForm">
            <div class="mb-3">
                <label class="form-label">Available Time</label>
                <input type="text" class="form-control" id="available_time" placeholder="e.g., Mon-Fri 9AM-5PM" required>
            </div>
            <button type="submit" class="btn btn-primary">Update</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/doctor.js"></script>
</body>
</html>
